name: Unit Tests

on:
  push:
    branches:
      - my-releases
    paths:
      - 'V2rayNG/**'
      - 'AndroidLibXrayLite'
      - '.github/workflows/unit-test.yml'
  pull_request:
    branches:
      - my-releases
    paths:
      - 'V2rayNG/**'
      - 'AndroidLibXrayLite'
      - '.github/workflows/unit-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch AndroidLibXrayLite tag
        run: |
          git submodule update --init AndroidLibXrayLite
          CURRENT_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          echo "Current tag in this repo: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          mkdir -p V2rayNG/app/libs

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 'patterniha/AndroidLibXrayLite'
          tag: '${{ env.CURRENT_TAG }}'
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.1 build-tools;37.0.0'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests
        run: |
          cd "${{ github.workspace }}/V2rayNG"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: V2rayNG/app/build/reports/tests/testPlaystoreDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
